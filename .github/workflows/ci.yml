name: CI

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release
        run: cargo build --release --bin ljs --bin test262
      - name: Test
        run: cargo test --release
      - name: Smoke test
        shell: bash
        run: |
          echo 'console.log(1 + 2);' > smoke.js
          ./target/release/ljs smoke.js
