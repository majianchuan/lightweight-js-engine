[package]
name = "ljs"
version = "0.1.0"
edition = "2021"
description = "A lightweight JavaScript engine written in Rust"
license = "MIT"

[[bin]]
name = "ljs"
path = "src/main.rs"

[dependencies]
oxc_allocator = "0.158.0"
oxc_ast = { version = "0.158.0", features = ["serialize"] }
oxc_parser = "0.158.0"
oxc_span = "0.158.0"
oxc_str = "0.158.0"
oxc_syntax = "0.158.0"
num-bigint = "0.4"
num-traits = "0.2"
chrono = "0.4"
regress = { version = "0.12", features = ["utf16"] }
ryu-js = "1.0"
indexmap = "2"
rustc-hash = "2"

serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
unicode-id-start = "1.5"
unicode-normalization = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
